<!-- Scholarships Section -->
<div class="section" id="scholarships-section">
  <h3 class="section-title">Scholarships 2027 – ₹7K to Full Fee Reimbursement</h3>
  <p class="section-sub">State, Central, Company & Trust scholarships for Engineering, MBBS, Arts, Girls, SC/ST, Minority. Filter by type. <span style="font-size:11px;color:#94a3b8">Data Source: data/scholarships.json</span></p>
  
  <div class="filters">
    <select id="schType">
      <option value="All">All Types</option>
      <option value="State">State</option>
      <option value="Central">Central</option>
      <option value="Company">Company</option>
      <option value="Trust">Trust</option>
    </select>
    <input id="schSearch" type="text" placeholder="Search e.g. Girls, SC, Pragati, Tata..." />
  </div>

  <div class="cards-grid" id="schCards">
    <div style="text-align:center;padding:20px;color:#94a3b8">Loading scholarships from JSON...</div>
  </div>
</div>
